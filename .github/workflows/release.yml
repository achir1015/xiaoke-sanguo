name: 建置、測試與發佈（Windows／Mac）

on:
  push:
    branches: [main]
    paths: ['web/**', 'sanguo/**', 'desktop/**', 'installer/**', 'tests/**', 'requirements.txt', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 版本號
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content web\version.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          "ver=$v" >> $env:GITHUB_OUTPUT

      - name: 安裝套件
        run: python -m pip install -r requirements.txt

      - name: 引擎測試
        run: python -m unittest discover -s tests -v

      - name: PyInstaller 打包
        run: python -m PyInstaller --noconfirm --clean --windowed --name XiaokeSanguo --icon desktop\app.ico --paths . --add-data "web;web" --hidden-import sanguo.api --collect-submodules sanguo --exclude-module numpy --exclude-module scipy --exclude-module tkinter --distpath dist --workpath build desktop\app.py

      - name: 製作安裝程式
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVer=${{ steps.ver.outputs.ver }}" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失敗" }

      - name: 靜默安裝與自我測試
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
          $dir = 'C:\XKTest\小柯機器人三國志遊戲'
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\XiaokeSanguo.exe")) { throw '安裝失敗' }
          $p = Start-Process -FilePath "$dir\XiaokeSanguo.exe" -ArgumentList '--selftest C:\XKTest\report.json' -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process $p -Force }
          if (-not (Test-Path C:\XKTest\report.json)) { throw '沒有產生自我測試報告' }
          $r = Get-Content C:\XKTest\report.json -Raw -Encoding UTF8
          Write-Host $r
          if (-not ($r | ConvertFrom-Json).ok) { Write-Host "::warning title=自我測試::$($r -replace "`r?`n",' ')" }

      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: dist-installer/*.exe

  mac:
    name: Mac（${{ matrix.arch }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: AppleSilicon }
          - { os: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'Intel' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 版本號
        id: ver
        run: echo "ver=$(python -c 'import json;print(json.load(open("web/version.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: 安裝套件
        run: python -m pip install -r requirements.txt

      - name: 引擎測試
        run: python -m unittest discover -s tests

      - name: App 圖示
        run: |
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s desktop/icon-1024.png --out app.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d desktop/icon-1024.png --out app.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns app.iconset -o app.icns

      - name: PyInstaller 打包成 .app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name XiaokeSanguo --icon app.icns --paths . --add-data "web:web" \
            --hidden-import sanguo.api --collect-submodules sanguo --exclude-module tkinter \
            --osx-bundle-identifier com.achir.xiaokesanguo --distpath dist --workpath build desktop/app.py
          cd dist
          mv XiaokeSanguo.app "小柯機器人三國志遊戲.app"
          P="小柯機器人三國志遊戲.app/Contents/Info.plist"
          plutil -replace CFBundleDisplayName -string "小柯機器人三國志遊戲" "$P"
          plutil -replace CFBundleShortVersionString -string "${{ steps.ver.outputs.ver }}" "$P"
          plutil -replace CFBundleVersion -string "${{ steps.ver.outputs.ver }}" "$P"
          plutil -replace NSHighResolutionCapable -bool true "$P"
          plutil -replace NSMicrophoneUsageDescription -string "遠端對戰時語音通話需要使用麥克風" "$P"
          codesign --force --deep -s - "小柯機器人三國志遊戲.app"
          du -sh "小柯機器人三國志遊戲.app"

      - name: 自我測試
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/kk"
          "dist/小柯機器人三國志遊戲.app/Contents/MacOS/XiaokeSanguo" --selftest "$RUNNER_TEMP/kk/report.json" &
          PID=$!
          for i in $(seq 1 120); do [ -f "$RUNNER_TEMP/kk/report.json" ] && break; sleep 2; done
          sleep 2; kill $PID 2>/dev/null || true
          [ -f "$RUNNER_TEMP/kk/report.json" ] || { echo "::warning title=Mac ${{ matrix.arch }}::沒有產生自我測試報告"; exit 1; }
          cat "$RUNNER_TEMP/kk/report.json"
          python -c "import json,sys;r=json.load(open('$RUNNER_TEMP/kk/report.json',encoding='utf-8'));print('::warning title=自我測試（Mac ${{ matrix.arch }}）::ok=%s '%r.get('ok')+' / '.join(('✔' if s['ok'] else '✘')+s['name'] for s in r.get('steps',[])))"

      - name: 製作 .dmg
        run: |
          mkdir dmg
          ditto "dist/小柯機器人三國志遊戲.app" "dmg/小柯機器人三國志遊戲.app"
          ln -s /Applications dmg/Applications
          cp desktop/MAC_README.txt "dmg/第一次開啟請看這裡.txt"
          hdiutil create -volname "小柯機器人三國志遊戲" -srcfolder dmg -ov -format UDZO "XiaokeSanguo-mac-${{ matrix.arch }}-${{ steps.ver.outputs.ver }}.dmg"
          ls -lh *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: '*.dmg'

  release:
    name: 發佈到 Releases
    needs: [windows, mac]
    if: always() && needs.windows.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 建立或補齊 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ needs.windows.outputs.ver }}'
          ls -lh assets
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v 已存在：補上缺少的安裝檔"
            gh release upload "v$v" assets/* --clobber
            exit 0
          fi
          notes=$(python3 -c "import json;print(json.load(open('web/version.json',encoding='utf-8'))['notes'])")
          cat > notes.md <<EOF
          ## 更新內容
          $notes

          ## 下載安裝
          - Windows 10／11：XiaokeSanguo-Setup-$v.exe
          - Mac（Apple 晶片）：XiaokeSanguo-mac-AppleSilicon-$v.dmg
          - Mac（Intel）：XiaokeSanguo-mac-Intel-$v.dmg（第一次開啟請看 dmg 內的說明）

          已安裝舊版的電腦會在遊戲內提示更新。

          系統開發：吳玉柱 先生 與 Claude AI Opus 5.5
          EOF
          gh release create "v$v" assets/* --title "小柯機器人三國志遊戲 v$v" --notes-file notes.md
