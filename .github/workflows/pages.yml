name: 線上版（GitHub Pages）

on:
  push:
    branches: [main]
    paths: ['web/**', 'sanguo/**', 'tools/build_web.py', 'tools/vendor/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 引擎測試
        run: python -m unittest discover -s tests
      - name: 產生網頁版
        run: |
          python tools/build_web.py site
          if [ -d docs ]; then cp -R docs/. site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
